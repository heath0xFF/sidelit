name: Release macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check release version and source
        id: version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const metadata = JSON.parse(execFileSync('cargo', ['metadata', '--no-deps', '--locked', '--format-version', '1', '--manifest-path', 'src-tauri/Cargo.toml']));
          const rust = metadata.packages.find(p => p.name === 'sidelit');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(config.version, pkg.version, 'Tauri and package versions must match');
          assert.equal(rust.version, pkg.version, 'Rust and package versions must match');
          assert.equal(config.plugins.updater.requireSignedVersion, true);
          assert.deepEqual(config.plugins.updater.endpoints, ['https://github.com/heath0xFF/sidelit/releases/latest/download/latest.json']);
          for (const flag of ['dangerousInsecureTransportProtocol', 'dangerousAcceptInvalidCerts', 'dangerousAcceptInvalidHostnames', 'allowDowngrades']) assert.notEqual(config.plugins.updater[flag], true);
          const tag = `v${pkg.version}`;
          assert.equal(process.env.GITHUB_REF_NAME, process.env.GITHUB_REF_TYPE === 'tag' ? tag : 'main', 'Release from main or the matching version tag');
          const existing = spawnSync('git', ['rev-parse', '--verify', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' });
          if (existing.status === 0) assert.equal(existing.stdout.trim(), execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), 'This version tag points to another commit; bump the version');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install and test
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo tree --manifest-path src-tauri/Cargo.toml --locked --edges normal > "$RUNNER_TEMP/runtime-dependencies.txt"
          if grep 'tauri-plugin-wdio-webdriver' "$RUNNER_TEMP/runtime-dependencies.txt"; then
            echo '::error::Release builds must not include the desktop test server.'
            exit 1
          fi

      - name: Build universal DMG and signed update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          # Old installers in the Rust cache must not enter a new release.
          rm -rf src-tauri/target/universal-apple-darwin/release/bundle
          pnpm tauri build --ci --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked

      - name: Verify installer
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Sidelit.app
          codesign --verify --deep --strict "$app"
          # Separate checks work across Xcode lipo versions.
          lipo "$app/Contents/MacOS/sidelit" -verify_arch arm64
          lipo "$app/Contents/MacOS/sidelit" -verify_arch x86_64
          "$app/Contents/MacOS/sidelit" --version
          git diff --exit-code
          cd src-tauri/target/universal-apple-darwin/release/bundle/dmg
          images=(*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"
          mount="$RUNNER_TEMP/sidelit-installer"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${images[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          test -d "$mount/Sidelit.app"
          test "$(readlink "$mount/Applications")" = /Applications
          codesign --verify --deep --strict "$mount/Sidelit.app"

      - name: Verify signed update and create manifest
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          cargo run --manifest-path src-tauri/Cargo.toml --locked --example update-manifest -- "$bundle"
          mkdir -p "$RUNNER_TEMP/update-archive"
          tar -xzf "$bundle/macos/Sidelit.app.tar.gz" -C "$RUNNER_TEMP/update-archive"
          codesign --verify --deep --strict "$RUNNER_TEMP/update-archive/Sidelit.app"
          cmp "$bundle/macos/Sidelit.app/Contents/MacOS/sidelit" "$RUNNER_TEMP/update-archive/Sidelit.app/Contents/MacOS/sidelit"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$bundle/dmg/"*.dmg "$bundle/macos/Sidelit.app.tar.gz" "$bundle/macos/Sidelit.app.tar.gz.sig" "$bundle/latest.json" "$RUNNER_TEMP/release-assets/"
          cd "$RUNNER_TEMP/release-assets"
          shasum -a 256 *.dmg *.tar.gz *.sig latest.json > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Install Sidelit
          Download the `.dmg` below, open it, and drag **Sidelit** into **Applications**. Eject the disk image, then open Sidelit from Applications. No Node, pnpm, or Rust is needed.

          Requires macOS 13 or later. The universal app includes Apple Silicon and Intel binaries. Intel runtime checks are still pending.

          **This release is ad-hoc signed, not Apple-notarized.** If macOS blocks the first launch, use **System Settings → Privacy & Security → Open Anyway** for Sidelit, only if you trust this download. Do not disable Gatekeeper.

          **New in 0.4.2: warm accents and a matching welcome icon.**

          - Amber actions in Dark and burnt-orange actions in Light match The Fold icon. Charcoal surfaces and syntax colors are unchanged.
          - Links, focus rings, editor selections, diagrams, and preview highlights use the new accents. Button labels, selected text, and errors have tested contrast in both themes.
          - The welcome screen now uses The Fold icon and follows system appearance automatically.

          **Included from 0.4.1: The Fold app icons.**

          - New light and dark icons replace the previous app icon.
          - The running Dock icon follows system appearance at startup and on changes, independently of the editor theme. Finder keeps the static light icon.
          - The app does not rewrite its signed bundle when appearance changes.

          **Included from 0.4.0: saved review notes and safer request handling.**

          - **Collect while reading.** Choose **Add to review** to keep up to 20 notes locally. Open **Notes** to edit, remove, or reveal a capture, then select notes from one project and send them as one Pi message. Each note keeps its own Explain, Review, or Edit intent.
          - **Review before sending.** Choose the Pi session explicitly and inspect the exact batch payload. Changed or restored captures need acknowledgment. Retries keep the same ID, destination, and payload, including after restart. Nothing sends automatically.
          - **Find your draft.** **Unsent draft** stays visible in the toolbar, including in narrow windows. Escape and Hide clear the selection highlight without deleting the request. **View request** replaces the label once delivery starts.
          - **Quit safely.** Unsent requests and unsaved note edits offer **Save to Notes**, **Discard**, or **Cancel** on Quit, window close, and update/restart. Failed saves keep the app open and retain the draft. Unchanged saved notes need no extra prompt.
          - **Read Markdown with HTML comments.** Complete comments remain hidden and unchanged in a read-only Rendered preview. Use Source to edit. Raw HTML and unsupported syntax still keep their fidelity safeguards.

          **Pi users:** after updating, run `sidelit setup --pi --skill`, then `/reload` in each intended Pi session. Batch delivery needs the updated extension; older extensions still support quick requests. Setup preserves custom installations.

          This patch passed 144 frontend/bridge tests, 28 Rust tests, and packaged macOS editor and feedback smoke tests. Light/dark welcome icons, diagram previews, and feedback highlights were visually checked. Live system Light/Dark switching still needs a manual check. VoiceOver, Intel runtime, and older macOS versions remain unverified.

          Saved notes use private OS permissions, not encryption. Force-quit or a crash can still lose an unsaved quick draft. Receipt and acceptance do not mean the work is complete; answers stay in Pi. Standalone MDX imports require your development server; server inspection requires the opt-in preview bridge. Explain/Review express intent to Pi, not an edit-permission boundary. See the README for setup and security details.

          **From 0.1.1 or later:** use **Actions → Check for Updates**, then **Install & Restart**.

          **Upgrading from 0.1.0:** install this DMG once. Save your work and quit Sidelit before replacing the app. From 0.1.1 onward, Sidelit checks for updates on startup and daily; use **Install & Restart** or **Actions → Check for Updates**. Unsaved drafts use the normal Save/Discard/Cancel prompts. Failed updates keep drafts in memory. Your Markdown files and recovery data stay separate from the app.

          `SHA256SUMS.txt` contains the asset checksums. The `.app.tar.gz`, `.sig`, and `latest.json` files are for the updater. The “Source code” archives are not installers.
          NOTES
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* \
            --target "$(git rev-parse HEAD)" --title "Sidelit $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Download: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
